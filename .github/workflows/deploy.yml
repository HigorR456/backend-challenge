name: Deploy NestJS to AWS EC2

on:
  push:
    branches:
      - aws

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      RDS_URL: ${{ secrets.RDS_URL }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build app locally
      run: |
        yarn install --frozen-lockfile
        yarn build

    - name: Prepare SSH key
      run: |
        echo "${{ secrets.EC2_KEY }}" > ec2_key.pem
        chmod 600 ec2_key.pem

    - name: Copy project to EC2
      run: |
        rsync -avz -e "ssh -i ec2_key.pem -o StrictHostKeyChecking=no" . $EC2_USER@$EC2_HOST:~/nestjs-app

    - name: Run deployment commands on EC2
      run: |
        ssh -i ec2_key.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << EOF
          cd ~/nestjs-app

          export DATABASE_URL="${RDS_URL}"

          # Ensure Node and PM2 are installed (Amazon Linux compatible)
          source ~/.nvm/nvm.sh || true
          command -v node || curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
          source ~/.nvm/nvm.sh
          nvm install 20
          nvm use 20
          yarn install -g pm2

          yarn install --frozen-lockfile
          npx prisma generate
          npx prisma migrate deploy

          yarn build

          pm2 restart app || pm2 start dist/main.js --name app
        EOF